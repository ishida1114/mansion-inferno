<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>怠惰な僕の悪魔辞典～マンション・インフェルノ～</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ゲーム全体コンテナ -->
  <div id="game-container">

    <!-- 1. 3Dダンジョン描画用 Canvas (renderer.js がここへ描画します) -->
    <canvas id="game-canvas" width="640" height="480"></canvas>

    <!-- 2. タイトル画面 (タイトルロゴ: akumanologo.png) -->
    <div id="title-screen" class="overlay-screen">
      <div class="title-content">
        <img id="title-logo" src="assets/images/akumanologo.png" alt="怠惰な僕の悪魔辞典" />
        <div class="title-menu">
          <button id="btn-start" class="menu-btn">ゲームスタート</button>
          <button id="btn-load" class="menu-btn">つづきから</button>
        </div>
      </div>
    </div>

    <!-- 3. スマホアプリ「悪魔辞典」画面 (appUI.js がここへ描画します) -->
    <div id="app-ui-container" class="hidden"></div>

    <!-- 4. メッセージ・会話ダイアログ (ui.js 用) -->
    <div id="dialog-overlay" class="hidden">
      <div id="dialog-box">
        <div id="dialog-speaker"></div>
        <div id="dialog-text"></div>
        <button id="dialog-next-btn">次へ</button>
      </div>
    </div>

    <!-- 5. 戦闘・査問画面オーバーレイ (combat.js 用) -->
    <div id="combat-overlay" class="hidden">
      <div id="combat-box"></div>
    </div>

    <!-- 6. イベント・背景動画再生用要素 (影山や血の池などの演出用) -->
    <video id="event-video" class="hidden" playsinline muted></video>

  </div>

  <!-- JavaScriptモジュールのエントリーポイント -->
  <script type="module" src="main.js"></script>
</body>
</html>
